name: config-prettier
on:
  push:
    branches:
      - main
    paths:
      - "config-prettier/**"
      - ".github/workflows/config-prettier.yaml"
  pull_request:
    paths:
      - "config-prettier/**"
      - ".github/workflows/config-prettier.yaml"
    types:
      - opened
      - synchronize

permissions:
  contents: write # tag creation and version commits
  id-token: write # npm provenance when publishing

jobs:
  pipe:
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: false
    uses: openmfp/gha/.github/workflows/pipeline-node-module.yml@6c6f84d08f3365e47db624fa467b8ae5c25d0211 # main
    secrets: inherit
    with:
      workingDirectory: "config-prettier"
      prefix: "config-prettier/"
      environment: "npmjs:@openmfp/config-prettier"
